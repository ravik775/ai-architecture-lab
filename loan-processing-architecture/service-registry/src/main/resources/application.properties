spring.application.name=service-registry
server.port=8086

# Eureka

eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://localhost:8086/eureka/
# Self-preservation stops Eureka evicting instances whenever heartbeat volume
# dips below its expected threshold - which, in a demo with only two clients,
# is effectively always. The result is that a container that has been replaced
# stays registered as UP forever, and the gateway's load balancer keeps
# round-robining onto a dead port (connection refused -> circuit breaker ->
# fallback). Off for local/demo use; leave it ON in production, where the
# heartbeat volume is high enough for the heuristic to be meaningful.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000