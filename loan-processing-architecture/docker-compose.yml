services:
  service-registry:
    profiles: [loan]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: service-registry
    ports:
      - "8086:8086"
    networks:
      - loan-net

  api-gateway:
    profiles: [loan]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    labels:
      - "spiffe.workload=api-gateway"
    env_file:
      - .env.sb
    environment:
      SERVER_PORT: 8085
    ports:
      - "8085:8085"
    depends_on:
      service-registry:
        condition: service_started
      redis:
        condition: service_healthy
      api-gateway-spiffe-helper:
        condition: service_healthy
    volumes:
      - spire-agent-socket:/tmp/spire-agent/public
      - spiffe-gateway-certs:/spiffe-certs:ro
    networks:
      - loan-net

  loan-service:
    profiles: [loan]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: loan-service
    labels:
      - "spiffe.workload=loan-service"
    env_file:
      - .env.sb
    environment:
      SERVICE: LOAN
      LOAN_SERVER_PORT: 0
      EUREKA_INSTANCE_HOSTNAME: loan-service
    volumes:
      - spiffe-loan-certs:/spiffe-certs:ro
    depends_on:
      service-registry:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      loan-service-spiffe-helper:
        condition: service_healthy
    networks:
      - loan-net

  redis:
    profiles: [loan]
    image: redis:7.4-alpine
    container_name: redis
    restart: unless-stopped
    env_file:
      - .env.sb
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loan-net

  rabbitmq:
    profiles: [loan]
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - .env.sb
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loan-net

  # ---------------------------------------------------------------------
  # SPIRE control plane
  # ---------------------------------------------------------------------

  spire-server:
    profiles: [loan]
    image: ghcr.io/spiffe/spire-server:1.9.6
    hostname: spire-server
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server:/opt/spire/conf/server
      - spire-server-data:/opt/spire/data/server
      - spire-server-socket:/tmp/spire-server/private
    ports:
      - "8081:8081"
    healthcheck:
      test:
        - "CMD"
        - "/opt/spire/bin/spire-server"
        - "entry"
        - "show"
        - "-socketPath"
        - "/tmp/spire-server/private/api.sock"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - loan-net

  # One-shot: waits for spire-server, mints a join token, writes it to a
  # shared volume, and creates the two registration entries idempotently.
  # Nothing downstream needs manual steps anymore.
  spire-bootstrap:
    profiles: [loan]
    build:
      context: ./spire/bootstrap
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - spire-server-socket:/tmp/spire-server/private
      - spire-join-token:/shared
    restart: "no"
    networks:
      - loan-net

  spire-agent:
    profiles: [loan]
    build:
      context: ./spire/agent-wrapper
    hostname: spire-agent
    pid: host
    depends_on:
      spire-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./spire/agent:/opt/spire/conf/agent
      - spire-agent-data:/opt/spire/data/agent
      - spire-agent-socket:/tmp/spire-agent/public
      - spire-join-token:/shared:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        - "CMD"
        - "/opt/spire/bin/spire-agent"
        - "healthcheck"
        - "-socketPath"
        - "/tmp/spire-agent/public/api.sock"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - loan-net

  # ---------------------------------------------------------------------
  # SVID delivery sidecars (one per workload)
  # ---------------------------------------------------------------------

  loan-service-spiffe-helper:
    profiles: [ loan ]
    build:
      context: ./loan-service-spiffe-helper
      args:
        SPIFFE_UID: "10001"
        SPIFFE_GID: "10001"
    labels:
      - "spiffe.workload=loan-service"
    depends_on:
      spire-agent:
        condition: service_healthy
    volumes:
      - spire-agent-socket:/tmp/spire-agent/public
      - spiffe-loan-certs:/spiffe-certs
    healthcheck:
      test: [ "CMD-SHELL", "test -s /spiffe-certs/svid.pem" ]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 15s
    networks:
      - loan-net

  api-gateway-spiffe-helper:
    profiles: [ loan ]
    build:
      context: ./api-gateway-spiffe-helper
      args:
        SPIFFE_UID: "10002"
        SPIFFE_GID: "10002"
    labels:
      - "spiffe.workload=api-gateway"
    depends_on:
      spire-agent:
        condition: service_healthy
    volumes:
      - spire-agent-socket:/tmp/spire-agent/public
      - spiffe-gateway-certs:/spiffe-certs
    healthcheck:
      test: [ "CMD-SHELL", "test -s /spiffe-certs/svid.pem" ]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 15s
    networks:
      - loan-net

volumes:
  redis-data:
  rabbitmq-data:
  spire-server-data:
  spire-agent-data:
  spire-agent-socket:
  spire-server-socket:
  spire-join-token:
  spiffe-loan-certs:
  spiffe-gateway-certs:

networks:
  loan-net:
    name: loan