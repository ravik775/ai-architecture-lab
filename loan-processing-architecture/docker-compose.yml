services:
  service-registry:
    profiles: [loan]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: service-registry
    ports:
      - "8086:8086"
    networks:
      - loan-net

  api-gateway:
    profiles: [loan]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: api-gateway
    labels:
      - "spiffe.workload=api-gateway"
    env_file:
      - .env.sb
    environment:
      SERVER_PORT: 8085
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "8085:8085"
    depends_on:
      service-registry:
        condition: service_started
      redis:
        condition: service_healthy
      api-gateway-spiffe-helper:
        condition: service_healthy
      jaeger:
        condition: service_started
    volumes:
      - spire-agent-socket:/tmp/spire-agent/public
      - spiffe-gateway-certs:/spiffe-certs:ro
    networks:
      - loan-net

  loan-service:
    profiles: [loan]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: loan-service
    labels:
      - "spiffe.workload=loan-service"
    env_file:
      - .env.sb
    environment:
      SERVICE: LOAN
      LOAN_SERVER_PORT: 0
      EUREKA_INSTANCE_HOSTNAME: loan-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - spiffe-loan-certs:/spiffe-certs:ro
    depends_on:
      service-registry:
        condition: service_started
      # No redis dependency: loan-service does not use Redis. Waiting on it only
      # coupled startup to a service it never talks to.
      rabbitmq:
        condition: service_healthy
      loan-service-spiffe-helper:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - loan-net

  redis:
    profiles: [loan]
    image: redis:7.4.10-alpine
    container_name: redis
    restart: unless-stopped
    env_file:
      - .env.sb
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command:
      - sh
      - -c
      - redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - loan-net

  rabbitmq:
    profiles: [loan]
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    env_file:
      - .env.sb
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Each rabbitmq-diagnostics invocation boots a short-lived Erlang CLI
      # node, which routinely takes several seconds on a loaded machine. Running
      # two of them under a 5s timeout meant the probe failed while the broker
      # was demonstrably fine ("fully booted and running"), marking rabbitmq
      # unhealthy and blocking every dependent container from starting.
      # One check, with a timeout that reflects what the command actually costs.
      test:
        - CMD-SHELL
        - rabbitmq-diagnostics -q check_running
      interval: 15s
      timeout: 20s
      retries: 5
      start_period: 30s
    networks:
      - loan-net

  # ---------------------------------------------------------------------
  # SPIRE control plane
  # ---------------------------------------------------------------------

  spire-server:
    profiles: [loan]
    image: ghcr.io/spiffe/spire-server:1.9.6
    hostname: spire-server
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./spire/server:/opt/spire/conf/server
      - spire-server-data:/opt/spire/data/server
      - spire-server-socket:/tmp/spire-server/private
    ports:
      - "8081:8081"
    healthcheck:
      test:
        - "CMD"
        - "/opt/spire/bin/spire-server"
        - "entry"
        - "show"
        - "-socketPath"
        - "/tmp/spire-server/private/api.sock"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - loan-net

  # One-shot: waits for spire-server, mints a join token, writes it to a
  # shared volume, and creates the two registration entries idempotently.
  # Nothing downstream needs manual steps anymore.
  spire-bootstrap:
    profiles: [loan]
    build:
      context: ./spire/bootstrap
    depends_on:
      spire-server:
        condition: service_healthy
    volumes:
      - spire-server-socket:/tmp/spire-server/private
      - spire-join-token:/shared
    restart: "no"
    networks:
      - loan-net

  spire-agent:
    profiles: [loan]
    build:
      context: ./spire/agent-wrapper
    hostname: spire-agent
    pid: host
    depends_on:
      spire-bootstrap:
        condition: service_completed_successfully
    volumes:
      - ./spire/agent:/opt/spire/conf/agent
      - spire-agent-data:/opt/spire/data/agent
      - spire-agent-socket:/tmp/spire-agent/public
      - spire-join-token:/shared:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test:
        - "CMD"
        - "/opt/spire/bin/spire-agent"
        - "healthcheck"
        - "-socketPath"
        - "/tmp/spire-agent/public/api.sock"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - loan-net

  # ---------------------------------------------------------------------
  # SVID delivery sidecars (one per workload)
  # ---------------------------------------------------------------------

  loan-service-spiffe-helper:
    profiles: [ loan ]
    build:
      context: ./loan-service-spiffe-helper
      args:
        SPIFFE_UID: "10001"
        SPIFFE_GID: "10001"
    labels:
      - "spiffe.workload=loan-service"
    depends_on:
      spire-agent:
        condition: service_healthy
    volumes:
      - spire-agent-socket:/tmp/spire-agent/public
      - spiffe-loan-certs:/spiffe-certs
    healthcheck:
      test: [ "CMD-SHELL", "test -s /spiffe-certs/svid.pem" ]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 15s
    networks:
      - loan-net

  api-gateway-spiffe-helper:
    profiles: [ loan ]
    build:
      context: ./api-gateway-spiffe-helper
      args:
        SPIFFE_UID: "10002"
        SPIFFE_GID: "10002"
    labels:
      - "spiffe.workload=api-gateway"
    depends_on:
      spire-agent:
        condition: service_healthy
    volumes:
      - spire-agent-socket:/tmp/spire-agent/public
      - spiffe-gateway-certs:/spiffe-certs
    healthcheck:
      test: [ "CMD-SHELL", "test -s /spiffe-certs/svid.pem" ]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 15s
    networks:
      - loan-net

  jaeger:
    profiles: [ loan ]
    image: jaegertracing/jaeger:2.5.0
    container_name: jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - loan-net

  keycloak:
    profiles: [ loan ]
    image: quay.io/keycloak/keycloak:26.7.1
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env.sb}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Health checks are disabled by default in the Keycloak Quarkus
      # distribution. Without this, the healthcheck below (GET /health/ready)
      # can never succeed - the container is marked unhealthy forever
      # regardless of whether Keycloak is actually working, a false negative
      # discovered by actually running the stack rather than just reading it.
      KC_HEALTH_ENABLED: "true"
      # Pin the issuer URL so the "iss" claim is identical no matter how the
      # token was obtained - from the host via localhost:8090 (IntelliJ .http,
      # Postman, curl) or from inside the Docker network via keycloak:8080.
      # Without this, Keycloak derives "iss" from the request's Host header
      # and host-issued tokens are rejected by the services with
      # "The iss claim is not valid". Services fetch signing keys separately
      # via jwk-set-uri, which stays on the internal address.
      KC_HOSTNAME: http://localhost:8090
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8090:8080"
    healthcheck:
      # Port 9000, not 8080: enabling KC_HEALTH_ENABLED moves health/metrics
      # to Keycloak's separate management interface rather than the main
      # HTTP port. Verified directly - hitting :8080/health/ready returns
      # 404 ("Unable to find matching target resource method"); :9000 returns
      # a real 200 with {"status":"UP"}.
      #
      # "Connection: close" is required too, not optional - Keycloak's HTTP
      # server keeps the socket open by default (HTTP/1.1 keep-alive), so
      # without it `cat <&3` blocks waiting for EOF that never comes until
      # the 3s timeout kills the check. That timeout is indistinguishable
      # from a real failure, so this healthcheck could never pass regardless
      # of the app's actual state - confirmed by reproducing the hang
      # directly before adding this header fixed it.
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'UP'" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks:
      - loan-net

volumes:
  redis-data:
  rabbitmq-data:
  spire-server-data:
  spire-agent-data:
  spire-agent-socket:
  spire-server-socket:
  spire-join-token:
  spiffe-loan-certs:
  spiffe-gateway-certs:
  keycloak-data:
networks:
  loan-net:
    name: loan