# Placeholder credentials, matching .env.sb's pattern for local/demo use -
# swap these for a real secret manager (Vault, Sealed Secrets, External
# Secrets Operator) before this touches anything beyond a local cluster.
# Committing a Secret manifest with literal values is itself only
# acceptable because these are the same non-production placeholders already
# committed in .env.sb for Docker Compose - not a new practice introduced
# here.
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
  namespace: loan
type: Opaque
stringData:
  REDIS_PASSWORD: change-this-redis-password
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: loan
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: admin
  RABBITMQ_DEFAULT_PASS: change-this-rabbit-password
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: loan
type: Opaque
stringData:
  KEYCLOAK_ADMIN_PASSWORD: something
