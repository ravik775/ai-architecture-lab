apiVersion: v1
kind: Namespace
metadata:
  name: loan
---
# Dedicated ServiceAccounts, one per workload. The SPIFFE ID each pod is
# issued is derived from (namespace, service account) via the k8s workload
# attestor - api-gateway and loan-service each need their own SA so their
# SPIFFE IDs are distinct and match the entries created in
# 02-spire-server.yaml (spiffe://example.org/ns/loan/sa/<name>), the same
# ID scheme already used by the Docker Compose deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: loan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-agent
  namespace: loan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: loan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loan-service
  namespace: loan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-registry
  namespace: loan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak
  namespace: loan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: loan
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rabbitmq
  namespace: loan
