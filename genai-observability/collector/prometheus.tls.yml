# TLS variant of prometheus.yml - scrapes the collector's Prometheus
# exporter over HTTPS instead of plaintext HTTP. Used by
# docker-compose.tls.yml instead of prometheus.yml.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    scheme: https
    tls_config:
      ca_file: /certs/ca.crt
      server_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
