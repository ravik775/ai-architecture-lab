# Pinned to 1 replica - the tail_sampling processor in this config needs
# every span of a given trace to land on the SAME collector instance to
# decide correctly (see configmap-otel-collector.yaml's comment and the
# project's README, "Known limitations"). Scaling this without a
# trace-ID-aware load balancer in front would silently break the "always
# keep failed-request traces" guarantee - it wouldn't error, it would just
# be quietly wrong, which is worse than not scaling it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: weatherapp
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: weather-intelligence-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: weather-intelligence-agent
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          env:
            - name: OTEL_TAIL_SAMPLING_BASELINE_PERCENT
              valueFrom:
                configMapKeyRef:
                  name: otel-collector-env
                  key: OTEL_TAIL_SAMPLING_BASELINE_PERCENT
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          # No exec-based probe: the contrib image ships no shell/curl to
          # run one with (same reason docker-compose has no HEALTHCHECK
          # here - see the original docker-compose.yml comment). The
          # health_check extension listens on 13133 but needs an HTTP
          # client to poll it that this image doesn't include either -
          # use an httpGet probe if your cluster's kubelet can reach it
          # directly (it can - httpGet probes are executed by the kubelet,
          # not from inside the container).
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-env
  namespace: weatherapp
  labels:
    app.kubernetes.io/part-of: weather-intelligence-agent
data:
  # Consumed by the tail_sampling processor's ${env:...} expansion inside
  # configmap-otel-collector.yaml - kept as its own tiny ConfigMap so it's
  # the one obvious place to tune without touching the collector's full
  # pipeline config. 100 = keep every successful trace; failed-request
  # traces are always kept regardless of this value.
  OTEL_TAIL_SAMPLING_BASELINE_PERCENT: "100"

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: weatherapp
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
