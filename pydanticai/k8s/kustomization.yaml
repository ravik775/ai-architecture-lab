apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weatherapp
resources:
  - namespace.yaml
  - network-policy.yaml
  - secrets.yaml
  - configmap-weather-app.yaml
  - configmap-litellm.yaml
  - configmap-otel-collector.yaml
  - configmap-prometheus.yaml
  - configmap-tempo.yaml
  - configmap-grafana-provisioning.yaml
  - configmap-grafana-dashboards.yaml
  - weather-app.yaml
  - litellm-proxy.yaml
  - otel-collector.yaml
  - prometheus.yaml
  - grafana.yaml
  - tempo.yaml
  - ingress.yaml
# Deliberately no commonLabels transformer - every resource already
# carries app.kubernetes.io/part-of by hand, and commonLabels also
# injects into spec.selector fields, which is an unnecessary risk next to
# zero benefit here.
