# StatefulSet + volumeClaimTemplates for the same reason as Prometheus -
# safe against data loss at any replica count. Default replicas: 1.
#
# Read this caveat before bumping replicas: Grafana's own state (users,
# dashboards saved via the UI, sessions) lives in a local SQLite file on
# each pod's own PVC by default. N replicas this way means N DIVERGENT
# instances, not one coherent HA service - each pod would show different
# session state. Verified against Grafana's own HA documentation: real
# multi-replica Grafana requires migrating that state to an external
# Postgres/MySQL database (plus Redis/Memcached for session cache). That's
# a real, separate stateful service - deliberately not pre-built here,
# see k8s/DECISIONS.md's D5 for the evidence and the upgrade path. Dashboards
# themselves are ConfigMap-provisioned as code either way, so this
# limitation only affects Grafana's OWN admin/user state, not the
# dashboards external users see.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: weatherapp
  labels:
    app.kubernetes.io/name: grafana
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: weatherapp
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: weather-intelligence-agent
spec:
  serviceName: grafana-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: weather-intelligence-agent
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:13.1.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: GF_SECURITY_ADMIN_PASSWORD
            # Read-only external exposure, implemented via Grafana's own
            # anonymous-access mechanism rather than bypassing auth
            # entirely: anonymous visitors (i.e. anyone hitting the public
            # Ingress without logging in) get the Viewer org role, which
            # cannot create/edit/delete dashboards, data sources, or
            # alerts - "no one except the app writes" in Grafana's own
            # terms, since dashboards are ConfigMap-provisioned code
            # (allowUiUpdates: false - see configmap-grafana-provisioning.yaml)
            # and viewers can't reach anything else with write semantics.
            # Whoever holds GF_SECURITY_ADMIN_PASSWORD can still log in
            # through the same public URL for administration.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_USERS_VIEWERS_CAN_EDIT
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning-datasources
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning-dashboards
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: grafana
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-headless
  namespace: weatherapp
  labels:
    app.kubernetes.io/name: grafana
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: weatherapp
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http

