# PLACEHOLDER VALUES - do not apply this file as-is, and never commit real
# secret values to git. This exists so `kubectl apply -k k8s/` produces a
# working (if insecure) demo out of the box, exactly like .env.example does
# for docker-compose.
#
# Native Kubernetes Secrets are base64-ENCODED, not encrypted, by default -
# anyone with `get secrets` RBAC in this namespace (or read access to the
# etcd backing store) can read these in plaintext. See k8s/DECISIONS.md's
# D9 for the upgrade path (Sealed Secrets, External Secrets Operator,
# Vault) and for enabling etcd encryption-at-rest, which native Secrets
# alone do not provide.
#
# Before any real use: replace every value below, then either
#   kubectl apply -f k8s/secrets.yaml --namespace weatherapp
# from a value store outside git (a password manager, `kubectl create
# secret generic ... --from-literal=...`, or a CI secret store), or switch
# to one of the options in DECISIONS.md's D9.
apiVersion: v1
kind: Secret
metadata:
  name: weather-app-secrets
  namespace: weatherapp
  labels:
    app.kubernetes.io/part-of: weather-intelligence-agent
type: Opaque
stringData:
  SECURITY__INTERNAL_API_TOKEN: "change-me-internal-token"
  SECURITY__JWT_SECRET: "change-me-jwt-secret-at-least-32-bytes-long"
  SECURITY__UI_STORAGE_SECRET: "change-me-ui-storage-secret-at-least-32-bytes"
  AGENT__LITELLM_API_KEY: "sk-local-virtual-key"
  # Uncomment to get a ready-to-use trace_admin login on first boot -
  # matches SECURITY__BOOTSTRAP_ADMIN_USERNAME/_PASSWORD in .env.example.
  # SECURITY__BOOTSTRAP_ADMIN_USERNAME: "admin"
  # SECURITY__BOOTSTRAP_ADMIN_PASSWORD: "change-me-admin-password"

---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: weatherapp
  labels:
    app.kubernetes.io/part-of: weather-intelligence-agent
type: Opaque
stringData:
  OPENROUTER_API_KEY: "replace_me"
  LITELLM_MASTER_KEY: "sk-local-virtual-key"

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: weatherapp
  labels:
    app.kubernetes.io/part-of: weather-intelligence-agent
type: Opaque
stringData:
  GF_SECURITY_ADMIN_PASSWORD: "admin"
