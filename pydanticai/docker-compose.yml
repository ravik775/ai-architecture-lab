x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  weather-net:
    driver: bridge

volumes:
  weather-data:
  tempo-data:
  prometheus-data:
  grafana-data:
  loki-data:

services:
  # ---------------------------------------------------------------------
  # Core services - `docker compose up --build`
  # ---------------------------------------------------------------------
  weather-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: weather-intelligence-agent:local
    env_file: .env
    environment:
      DATABASE__URL: sqlite+aiosqlite:////app/data/weather.db
      AGENT__LITELLM_BASE_URL: http://litellm-proxy:4000
      OBSERVABILITY__OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      # Host port configurable - default 8000 collides with other local
      # projects in this workspace on some machines; override in .env
      # via WEATHER_APP_PORT if needed.
      - "${WEATHER_APP_PORT:-8000}:8000"
      # Port 9464 (/metrics) is DELIBERATELY not published here - it's
      # still reachable by other containers on `weather-net` (e.g.
      # prometheus, see docker/prometheus.yml), just not from the host.
      # Uncomment only for local debugging with `curl localhost:9464/metrics`:
      # - "9464:9464"
    volumes:
      - weather-data:/app/data
    depends_on:
      litellm-proxy:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks: [weather-net]
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging
    # HEALTHCHECK is baked into the image (docker/Dockerfile).

  litellm-proxy:
    image: ghcr.io/berriai/litellm:v1.90.2
    env_file: .env
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks: [weather-net]
    restart: unless-stopped
    # 512m was measured OOM-killing this image on startup (exit 137, no
    # log output at all - it loads a large model/pricing catalog at
    # import time before anything hits stdout). 1024m confirmed sufficient.
    mem_limit: 1024m
    cpus: 1.0
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    environment:
      # Read by the tail_sampling processor's baseline-probabilistic
      # policy in otel-collector-config.yaml via ${env:...} expansion -
      # see that file's comment for why this replaced the app-side
      # OBSERVABILITY__TRACE_SAMPLING_RATIO setting.
      OTEL_TAIL_SAMPLING_BASELINE_PERCENT: ${OTEL_TAIL_SAMPLING_BASELINE_PERCENT:-100}
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    networks: [weather-net]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    # No HEALTHCHECK: the contrib image ships no shell/curl to exec a check
    # with, and the health_check extension endpoint (13133) isn't reachable
    # without one. weather-app depends on `service_started` only, not
    # health - acceptable because BatchSpanProcessor tolerates a collector
    # that isn't ready yet (it just retries/drops, never blocks the app).

  # ---------------------------------------------------------------------
  # `docker compose --profile observability up --build`
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: [observability]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [weather-net]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.2
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./dashboards/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, tempo]
    networks: [weather-net]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  tempo:
    image: grafana/tempo:3.0.2
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks: [weather-net]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  # ---------------------------------------------------------------------
  # `docker compose --profile observability --profile optional-loki up --build`
  # ---------------------------------------------------------------------
  loki:
    image: grafana/loki:3.7.6
    profiles: [optional-loki]
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./docker/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks: [weather-net]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging
