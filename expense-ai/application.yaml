environment: dev02

providers:
  - name: openrouter
    model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    base_url: https://openrouter.ai/api/v1

runtime:
    temperature: 0
    max_tokens: 4000
    timeout_seconds: 30
    priority: 1
    enabled: true
    stream: false
    max_retries: 3
    retry_backoff: 1.0

logging:
  log_prompts: false
  log_responses: false
  log_token_usage: true
  prompt_preview_chars: 300

observability:
  tracing_enabled: true
  metrics_enabled: true
  console_metric_exporter_enabled: false
  console_trace_exporter_enabled: false

circuit_breaker:
  failure_threshold: 5
  reset_timeout: 60
  success_threshold: 5