environment: dev02

data:
  database_url:
  database_sslmode: prefer

providers:
  - name: openrouter
    model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    enabled: false

  - name: openrouter
    model: openrouter/openai/gpt-oss-20b
    base_url: https://openrouter.ai/api/v1
    enabled: false

  - name: openrouter
    model: openrouter/meta-llama/llama-3.3-70b-instruct
    base_url: https://openrouter.ai/api/v1
    enabled: true

  - name: ollama
    model: ollama_chat/llama3.2:3b
    base_url: http://localhost:11434
    enabled: false

  - name: omniroute
    model: ollama_chat/llama3.2:3b
    base_url: http://localhost:9000
    enabled: false

  - name: nvidia
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    base_url: https://integrate.api.nvidia.com/v1/chat/completions
    enabled: false

runtime:
    timeout_seconds: 10
    max_retries: 1
    retry_backoff: 1.0
    temperature: 0
    max_tokens: 4000
    stream: false

logging:
  log_prompts: false
  log_responses: false
  log_token_usage: true
  prompt_preview_chars: 300

observability:
  tracing_enabled: true
  metrics_enabled: true
  console_metric_exporter_enabled: false
  console_trace_exporter_enabled: false

circuit_breaker:
  failure_threshold: 5
  reset_timeout: 60
  success_threshold: 5

pipeline:
  policies:
    - observability
    - provider_selection
    - retrieval
    - prompt_preparation
    - guardrail
    - cache
    - retry
    - circuit_breaker
    - timeout

rag:
  enabled: true
  collection_name: expense_policies
  persist_directory: .chroma
  top_k: 3