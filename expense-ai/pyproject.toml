[project]
name = "expense-ai"
version = "0.1.0"
description = "Provider-agnostic agentic AI expense approval platform with ChromaDB RAG, LangGraph human approval workflows, PostgreSQL checkpointing, and OpenTelemetry observability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cachetools==7.1.6",
    "chromadb==1.5.9",
    "fastapi==0.140.0",
    "httpx==0.28.1",
    "langchain==1.3.14",
    "langfuse==4.14.1",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres>=3.1.1",
    "litellm==1.74.8",
    "opentelemetry-api==1.44.0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-sdk==1.44.0",
    "pandas==3.0.5",
    "passlib==1.7.4",
    "psycopg[binary]==3.3.4",
    "psycopg-pool>=3.3.1",
    "pybreaker==1.4.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pytest==9.1.1",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "pyyaml==6.0.3",
    "tabulate==0.10.0",
    "tenacity==9.1.4",
    "uvicorn==0.51.0",
]
